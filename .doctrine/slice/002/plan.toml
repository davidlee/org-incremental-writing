# Implementation plan for SL-002 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-002"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One
#
# Every phase after PHASE-01 has the implicit entrance "previous phase
# completed; just gate green" (stated once, as EN-1). just gate = lint +
# test-all (Emacs 31.1 and 30.2). Every phase ends with just test-each green
# and an STD-001 item 3 mutation pass over the guards it added (ad hoc, under
# /home/scratch, until CHR-001), survivors killed or justified in the phase
# sheet.

[[phase]]
id        = "PHASE-01"
name      = "Placement core and the one allocator"
objective = "Add org-iw-core-placement-p, -placement-depth, -rank-at, -place and -reorder per design § 5.2, with the § 5.5 property tested both ways (RV-003 F-4). Delete org-iw-core-append-rank in the same change (POL-002); org-iw--append-rank delegates to rank-at at depth = count until PHASE-02 replaces it, so command behaviour and messages are unchanged this phase."
entrance_criteria = [
  { id = "EN-1", text = "SL-002 design locked (run dr-01a0f578); DEC-007..011 accepted; RV-003 findings all verified." },
]
exit_criteria = [
  { id = "EX-1", text = "placement-p accepts exactly the DEC-007 forms with natural-number fields, 0 < DEN, NUM <= DEN, P <= 100; rejects every § 9 negative case, including floats, extra elements, soon and (end)." },
  { id = "EX-2", text = "placement-depth uses integer arithmetic only and clamps to [0, COUNT]; an invalid placement signals wrong-type-argument, not org-iw-refusal." },
  { id = "EX-3", text = "rank-at implements the five ADR-004 cases of design § 5.2, returning nil for adjacent, tied and beyond-limit results; place returns (unchanged D), (moved D RANK) or (no-gap D), never unchanged for a nil target; reorder returns a new list and leaves ORDER unmodified." },
  { id = "EX-4", text = "Seeded property test (~500 cases; random orders with tied, adjacent, negative and near-limit ranks; nil targets via a fresh stand-in entry) asserts § 9's precedence-ordered biconditionals for unchanged, no-gap and moved (RV-003 F-4). Its checker has a self-test rejecting the four wrong results § 9 lists (STD-001 item 2)." },
  { id = "EX-5", text = "org-iw-core-append-rank and its tests are gone; grep finds no append-rank outside org-iw--append-rank, which calls rank-at. All existing command tests pass unmodified." },
  { id = "EX-6", text = "I6 still holds (core loads without org); spacing 1024 and limit 2^53 − 1 remain pinned as literals (STD-001 item 4)." },
  { id = "EX-7", text = "just gate and just test-each green; mutation pass over the new core guards recorded in the phase sheet." },
]
verification = [
  { id = "VT-1", expects = "placement-p and placement-depth tables of design § 9, incl. (percent 29) of 100 → 29 and the clamping cases", test_file = "test/org-iw-core-test.el", keywords = ["org-iw-core-placement-p", "org-iw-core-placement-depth", "(percent 29)", "(fraction 3 2)", "(after 10)"], waived = false },
  { id = "VT-2", expects = "rank-at per ADR-004 case: 1024 empty, front, end, 3584 between 3072/4096, nil adjacent 5/6, nil tied 7/7, -1536 between negatives, nil at each limit", test_file = "test/org-iw-core-test.el", keywords = ["org-iw-core-rank-at", "3584", "-1536"], waived = false },
  { id = "VT-3", expects = "place and reorder example tests: unchanged (last with end, first with (after 0)), moved, no-gap, nil target never unchanged; reorder front/middle/end", test_file = "test/org-iw-core-test.el", keywords = ["org-iw-core-place", "org-iw-core-reorder", "unchanged", "no-gap"], waived = false },
  { id = "VT-4", expects = "seeded property test plus its checker self-test", test_file = "test/org-iw-core-test.el", keywords = ["property", "self-test", "(random \""], waived = false },
  { id = "VA-1", text = "Agent greps the tree: no org-iw-core-append-rank; the only rank computation is rank-at (I10, interim wrapper excepted)." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Continue and Add through place"
objective = "Route the existing default Continue and plain Add through org-iw-core-place (§ 5.4) with placement end, before any vocabulary exists. Introduce org-iw--session-or-refuse, org-iw--refuse-no-room and org-iw--put-rank; delete org-iw--append-rank and org-iw--move-to-end (POL-002). Report an empty queue with a session (REQ-015)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 completed; just gate green." },
]
exit_criteria = [
  { id = "EX-1", text = "Continue follows § 5.4 steps 1, 3–7 with placement end: no session → refusal; empty order → \"Queue NAME is empty\", nothing changed, session kept; absent/duplicated → org-iw--refuse-absent; sole entry → report as today; then place." },
  { id = "EX-2", text = "Continue's messages take the § 5.4 forms with WHERE = \"the end\" pending labels (\"Moved T to the end, D+1/N STATUS. Now 1/N: NEXT\"; \"T already at the end, D+1/N. Now 1/N: NEXT\"); existing expectations updated in the same commit (RV-003 F-9). The final label wording lands in PHASE-04." },
  { id = "EX-3", text = "no-gap from Add or Continue refuses through org-iw--refuse-no-room (\"no room at the end in NAME; redistribution is not yet available — choose another placement\"); buffers, files and session unchanged (I9). The rank-limit tests now expect this text." },
  { id = "EX-4", text = "Plain Add calls place with a nil target and end; its message is unchanged (\"Added to NAME at N+1/N+1 STATUS\")." },
  { id = "EX-5", text = "grep finds no org-iw--append-rank, org-iw--move-to-end or org-iw-core-rank outside core and put-rank's :expected; no command computes a rank or depth (I10)." },
  { id = "EX-6", text = "just gate and just test-each green; mutation pass over the new guards (empty, no-gap, session) recorded." },
]
verification = [
  { id = "VT-1", expects = "Continue on an empty queue with a session reports empty and changes nothing; no-gap Continue and Add refuse with nothing changed (I9)", test_file = "test/org-iw-test.el", keywords = ["is empty", "no room at the end", "org-iw-cmd-test--should-refuse-cleanly"], waived = false },
  { id = "VT-2", expects = "existing Continue and Add tests pass with the new messages; already-last writes nothing", test_file = "test/org-iw-test.el", keywords = ["to the end", "already at the end"], waived = false },
  { id = "VA-1", text = "Agent greps for deleted helpers and any rank arithmetic outside org-iw-core.el (EX-5)." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "Vocabulary configuration"
objective = "Add the placement options and the vocabulary reader of design § 5.2: org-iw--placement-type, org-iw-placements, org-iw-default-placement, the :placements/:default options of org-iw-queues, org-iw--queue-config (the one reader; RV-003 F-6), org-iw--vocabulary, org-iw--placement and org-iw--read-placement. Extend org-iw-cmd-test--with-prompt to answer several prompts in turn and record each default and display order (no second recorder). No command uses the vocabulary yet."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 completed; just gate green." },
]
exit_criteria = [
  { id = "EX-1", text = "Defcustom defaults are pinned as literals: Soon (after 2), Later (fraction 1 2), End end; default \"End\" (DEC-009). The customize type is org-iw--placement-type; org-iw-queues' docstring and :type describe :placements and :default." },
  { id = "EX-2", text = "org-iw--configured-name reads through org-iw--queue-config; no other function reads org-iw-queues' plists." },
  { id = "EX-3", text = "org-iw--vocabulary resolves per § 5.2 (plist-member for :placements; default = :default, else the global default unless the queue has its own :placements, else the first label) and refuses each § 9 bad-config case — invalid placement, duplicate label, empty label, empty or present-but-nil list, missing default — naming the blamed source (queue NAME :placements / :default, org-iw-placements, org-iw-default-placement); at least one queue-blamed and one global-blamed case (RV-003 F-6)." },
  { id = "EX-4", text = "org-iw--placement returns (LABEL . PLACEMENT), the default's for nil, and refuses an unknown label naming it." },
  { id = "EX-5", text = "org-iw--read-placement resolves the vocabulary before prompting (bad config never prompts), calls completing-read \"Placement: \" with REQUIRE-MATCH t, the default label as DEF, and a table whose metadata sets display-sort-function to identity; the recorder captures the labels in configured order and the default." },
  { id = "EX-6", text = "The recorder extension has a self-test: it fails a test that prompts more often than answered, and records each prompt's default (STD-001 item 2). Helper-level tests of private vocabulary functions state their reason (STD-001 item 6): they are the one owner; command-level coverage follows in PHASE-04." },
  { id = "EX-7", text = "just gate and just test-each green; mutation pass over each validation guard recorded." },
]
verification = [
  { id = "VT-1", expects = "defaults pinned; queue-config is the one plist reader; vocabulary resolution and every bad-config refusal with its blamed source", test_file = "test/org-iw-test.el", keywords = ["org-iw-placements", "org-iw-default-placement", "org-iw--vocabulary", ":placements:", "org-iw-placements:", "org-iw-default-placement:"], waived = false },
  { id = "VT-2", expects = "read-placement offers labels in configured order with the default, metadata identity sort, and refuses bad config before prompting; recorder self-test", test_file = "test/org-iw-test.el", keywords = ["org-iw--read-placement", "display-sort-function", "Placement: "], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-04"
name      = "Placement on Continue and Add"
objective = "Give org-iw-continue and org-iw-add their optional LABEL and the prefix-argument chooser (DEC-011 as amended), resolving the placement before the scan (§ 5.4, RV-003 F-2), with the final label messages. Rewrite both docstrings, fixing Continue's half of ISS-001. Document placements, vocabulary and the chooser in README.md."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 completed; just gate green." },
]
exit_criteria = [
  { id = "EX-1", text = "Continue: LABEL nil → the queue's default; C-u reads one with org-iw--read-placement after org-iw--session-or-refuse; without a prefix no prompt (recorder asserts not called). Messages use the label: \"Moved T to LABEL, D+1/N STATUS. Now 1/N: NEXT\", \"T already at LABEL, D+1/N. Now 1/N: NEXT\", no-gap \"no room at LABEL in NAME; …\"." },
  { id = "EX-2", text = "Add: LABEL nil → end with today's message; with LABEL, \"Added to NAME at LABEL, D+1/N+1 STATUS\". The placement is resolved before the scan, so an unknown label or bad config refuses even for an existing member (RV-003 F-2). C-u Add reads the queue, canonicalises it, then the placement, defaulting to the queue's default label (DEC-011 amended, RV-003 F-5)." },
  { id = "EX-3", text = "Refuse before prompting (RV-003 F-7): C-u Continue without a session, C-u Continue with bad config, C-u Add with bad config after the queue prompt; the recorder fails if the placement prompt is reached." },
  { id = "EX-4", text = "Unconfigured queue of 8: Soon → 3rd, Later → 4th, End → 8th, exactly one changed line each (I2′, RV-003 F-3). Configured queue: its labels in configured order and its default; :default absent → first label; a queue with only :default uses the standard placements." },
  { id = "EX-5", text = "Unchanged Continue to Soon at depth 2 writes nothing and leaves the buffer unmodified (I2′); (after 0) reopens the same entry; Later in a 2-entry queue reopens the same entry (§ 5.5, RV-003 F-8); (org-iw-continue \"Soon\") from Lisp works and an unknown label refuses with nothing changed." },
  { id = "EX-6", text = "Continue and Add docstrings list the refusals and placement behaviour; Continue's preflight refusals are named (ISS-001, Continue half). README documents placement forms, :placements/:default, the two defcustoms and C-u." },
  { id = "EX-7", text = "just gate and just test-each green; mutation pass over the new command guards recorded." },
]
verification = [
  { id = "VT-1", expects = "Continue with each standard placement on a queue of 8; configured queue chooser order and default; C-u vs plain prompting; Lisp label; unknown label", test_file = "test/org-iw-test.el", keywords = ["Soon", "Later", "Moved A to", "already at Soon", "current-prefix-arg"], waived = false },
  { id = "VT-2", expects = "Add at a placement, Add prompt default, no-gap Add, existing member with unknown label refuses (F-2)", test_file = "test/org-iw-test.el", keywords = ["Added to ESSAYS at Soon", "org-iw-add"], waived = false },
  { id = "VT-3", expects = "refuse-before-prompt for C-u Continue (no session, bad config) and C-u Add (bad config) (F-7); small-queue Later (F-8)", test_file = "test/org-iw-test.el", keywords = ["call-interactively #'org-iw-continue", "call-interactively #'org-iw-add"], waived = false },
  { id = "VA-1", text = "Agent reads both docstrings and the README section against design § 5.2/§ 5.4 and DEC-007..011; checkdoc clean." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-05"
name      = "Human trial"
objective = "Run the design § 9 human trial (POL-003) on a Git-committed copy of real notes, and fold any defects back before audit."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 completed; just gate and just test-each green." },
]
exit_criteria = [
  { id = "EX-1", text = "The user has run trial steps 1–5 of design § 9 and reported the outcome; defects are fixed in this phase (TDD) or recorded as backlog items with the user's agreement." },
  { id = "EX-2", text = "just gate and just test-each green after any fixes." },
]
verification = [
  { id = "VH-1", text = "User runs design § 9 trial steps 1–5 (configured and unconfigured queue; each label; Soon until no room, nothing changed, then End; C-u Add at Soon; chooser order and RET in their completion UI) and confirms." },
]
specs        = []
requirements = []
