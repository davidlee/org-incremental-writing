name      = "Add handoff"
objective = "Hand off from Add at no gap (design § 5.2.3, DEC-036, D2, D9): the org-iw--joining token with its placement, --check-joinable extracted from --add-entry and run at the token's marker on every scan, --add-entry returning (no-gap DEPTH JOINING), --add-at handing off labelled or not, the joining marker re-homed to the base buffer, and batch add still refusing. Docstrings of Add and Add-document name the handoff."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 completed; just gate green." },
]
exit_criteria = [
  { id = "EX-1", text = "Labelled Add of an entry with no ID at no gap: one approval; the entry gains an ID and its rank at the intended slot; other members relaid. Unlabelled Add at the end limit hands off with pending text 'add TITLE at the end'. Add-document likewise." },
  { id = "EX-2", text = "Add from an org-tree-to-indirect-buffer view and from a narrowed buffer, in a file holding members whose ranks change: one group, every rank written, no error (STD-001 item 5); a read-only indirect buffer is a read-only blocker with no prompt." },
  { id = "EX-3", text = "Re-show: at a fraction label, a member added by hand while asking moves the entry by the fresh count; the entry itself enrolled (given an ID) by hand while asking → \"already in Q\", nothing written." },
  { id = "EX-4", text = "Batch add at the end limit still refuses with the no-room text (DEC-036)." },
  { id = "EX-5", text = "The existing tests add-refuses-at-rank-limit, add-document-refuses-at-rank-limit and add-refuses-without-gap are rewritten to expect the prompt (answered no: cancelled, state equal)." },
]
verification = [
  { id = "VT-1", expects = "Add handoff joins; unlabelled at the end; batch still refuses", test_file = "test/org-iw-test.el", keywords = ["org-iw--joining", "org-iw-cmd-test-add-handoff-joins", "org-iw-cmd-test-add-handoff-unlabelled-end"], waived = false },
  { id = "VT-2", expects = "indirect and narrowed Add handoff; read-only indirect blocker", test_file = "test/org-iw-test.el", keywords = ["org-iw-cmd-test-add-handoff-indirect", "org-iw-cmd-test-add-handoff-narrowed"], waived = false },
  { id = "VT-3", expects = "re-show recomputes; enrolled while asking refuses", test_file = "test/org-iw-test.el", keywords = ["org-iw--check-joinable", "org-iw-cmd-test-add-reshow-recomputes"], waived = false },
  { id = "VA-1", text = "Agent greps org-iw.el: the joinability checks (excluded types, shared ID, already a member) appear only in --check-joinable; --refuse-no-room's only caller is batch add." },
]
