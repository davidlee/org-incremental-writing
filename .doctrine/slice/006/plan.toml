# Implementation plan for SL-006 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-006"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# Conventions
#
# Every phase after PHASE-01 has the entrance "previous phase completed; just
# gate green" (EN-1). just gate = lint + test-all (Emacs 31 and 30). Every
# phase ends with just gate green and an STD-001 item 3 mutation pass over the
# guards it added (ad hoc, until CHR-001), survivors killed or justified in the
# phase sheet. "design §" means SL-006 design.md (locked, run rev 35). VT
# keywords name ert-deftest names or symbols used in test code, never message
# text (STD-002); a keyword that is a planned test name may be re-keyed by the
# append rule if the worker names the test differently. Every refusal is
# asserted by its text (design § 9). No phase changes ADR-002's save policy for
# single writes: only redistribution saves on consent (DEC-029, REV-007).

[[phase]]
id        = "PHASE-01"
name      = "Core plan and file checks"
objective = "Add the pure plan org-iw-core-redistribution (design § 5.2.1, DEC-035), discovery's predicate org-iw-discovery-org-mode-p (used by require-org-mode), and the write layer's one owner of file checks, org-iw-write-file-problems and org-iw-write-problem-text, with --check-file refusing through them (design § 5.2.2, D4). No command behaviour changes."
entrance_criteria = [
  { id = "EN-1", text = "SL-006 design locked (run rev 35); RV-014 concluded and disposed 'conducted', no finding routed demonstrate/probe/control; REV-007 proposed." },
]
exit_criteria = [
  { id = "EX-1", text = "org-iw-core-redistribution: the design § 5.2.1 example gives exactly ((B . 2048) (D . 3072) (C . 4096)); members already at k × spacing are left out; a non-entry element is always included; empty and already-normal orders give nil; applying the plan to the members' ranks sorts back to the intended order (R2). Literals pinned (STD-001 item 4)." },
  { id = "EX-2", text = "org-iw-discovery-org-mode-p is the derived-mode-p test; org-iw-discovery-require-org-mode uses it and its behaviour and text are unchanged." },
  { id = "EX-3", text = "org-iw-write-file-problems returns, in design order, each of changed-on-disk, not-writable, read-only (base or an indirect BUFFER), not-org, modified that holds; only not-writable without a buffer; visits nothing (org-iw-test-state equal). org-iw-write-problem-text gives today's texts plus \"unsaved changes\" and the require-org-mode text for not-org." },
  { id = "EX-4", text = "--check-file refuses on the first problem other than modified via file-problems, with BUFFER the marker's buffer; its separate indirect read-only check is gone. The existing put-rank and delete-rank suites pass unmodified (a modified buffer is still written and left unsaved)." },
]
verification = [
  { id = "VT-1", expects = "plan literals, joining included, empty/normal nil, order preserved", test_file = "test/org-iw-core-test.el", keywords = ["org-iw-core-redistribution", "org-iw-core-test-redistribution-relays-at-spacing", "org-iw-core-test-redistribution-includes-joining", "org-iw-core-test-redistribution-preserves-intended-order"], waived = false },
  { id = "VT-2", expects = "each file problem alone and in order, indirect read-only, not-org, no visiting", test_file = "test/org-iw-write-test.el", keywords = ["org-iw-write-file-problems", "org-iw-write-problem-text", "org-iw-write-test-file-problems-not-org", "org-iw-write-test-file-problems-indirect-read-only"], waived = false },
  { id = "VA-1", text = "Agent greps: derived-mode-p 'org-mode appears only in org-iw-discovery-org-mode-p; --check-file has no buffer-read-only test of its own; no other function in org-iw-write.el checks verify-visited-file-modtime or file-writable-p (one owner, POL-002)." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Grouped write and consent save"
objective = "Generalise the write path: --prepare-put, a grouped --apply over (MARKER . EDIT) pairs, --save extracted, org-iw-write-put-ranks, and org-iw-write-save-file; put-rank and delete-rank become one-element cases (design § 5.2.2, D3, DEC-029). No command behaviour changes."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 completed; just gate green." },
]
exit_criteria = [
  { id = "EX-1", text = "put-ranks with three changes in one file: every change preflighted before any edit, one atomic change group, one save (counted by after-save-hook); a stale :expected on the second change refuses with the buffer unchanged (R4)." },
  { id = "EX-2", text = "An edit that signals inside the group restores the whole buffer and its modified flag; the error propagates." },
  { id = "EX-3", text = "A drawerless joining document plus two heading members in one file: drawer, ID and three ranks written, every other line untouched; markers after point-min move correctly (design § 5.2.2 'Markers stay valid')." },
  { id = "EX-4", text = "Markers in more than one buffer signal an error before any change." },
  { id = "EX-5", text = "org-iw-write-save-file saves a modified buffer and returns saved; refuses, saving nothing, over any other file problem; returns (save-failed . ERR) when a write-file-functions hook fails, and (save-failed . still-modified) when an after-save-hook re-dirties the buffer. --save is the one save-and-catch, used by --apply and save-file." },
  { id = "EX-6", text = "put-rank is (put-ranks (list ...)) with its docstring unchanged; delete-rank calls --apply with one edit; the existing write suite passes unmodified." },
]
verification = [
  { id = "VT-1", expects = "one save, refusal before change, rollback, joining document drawer, one-buffer error", test_file = "test/org-iw-write-test.el", keywords = ["org-iw-write-put-ranks", "org-iw-write-test-put-ranks-one-save", "org-iw-write-test-put-ranks-refuses-before-any-change", "org-iw-write-test-put-ranks-rolls-back-group", "org-iw-write-test-put-ranks-joining-document-drawer", "org-iw-write-test-put-ranks-one-buffer"], waived = false },
  { id = "VT-2", expects = "save-file: saves, refuses over problems, save failure, re-dirtied", test_file = "test/org-iw-write-test.el", keywords = ["org-iw-write-save-file", "org-iw-write-test-save-file-refuses-changed-on-disk", "org-iw-write-test-save-file-redirtied"], waived = false },
  { id = "VA-1", text = "Agent greps org-iw-write.el: atomic-change-group and save-buffer each appear once (in --apply and --save); no preflight besides --prepare-put/--preflight (DEC-014, POL-002)." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "Redistribution flow and normalise"
objective = "Build the command-layer flow and its first entrance: the ;;;; Redistribution section with org-iw--redistribution (struct, build, show), org-iw--redistribute (preview, prompt with buffer naming, recheck loop, consent saves, per-file apply, interrupted rule, partition, four-group report), the --file-outcome / --outcome-report renames, --refuse-no-room's new text, and org-iw-normalise (design § 5.2.3, § 5.4, § 5.5; DEC-029..035, DEC-037; D1, D5..D7). Test helpers: org-iw-test-changed-files and the prompt stub's function answer, each with a self-test."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 completed; just gate green." },
]
exit_criteria = [
  { id = "EX-1", text = "Helpers (STD-001 item 2): org-iw-test-changed-files detects a change outside the expected set, a new file, a deleted file and a buffer-only change; org-iw-cmd-test--with-prompt accepts a function answer, calls it, uses its value, and fails on a value other than :yes/:no. org-iw-test--release kills *org-iw redistribution*." },
  { id = "EX-2", text = "Preview (DEC-031, DEC-032, DEC-037): the record and buffer hold queue, pending (nil for normalise), counts, the not-atomic/Git line, blockers, buffers to save, one button per file; source problems are counted; nothing is visited before approval." },
  { id = "EX-3", text = "Cancel and blockers (R1, REQ-019 AC1/AC4, DEC-030): answering no, and each blocker (read-only, unwritable, changed on disk, not-org), leave org-iw-test-state equal; blockers record no prompt; refusal texts as design § 5.2.3." },
  { id = "EX-4", text = "Consent (DEC-029, R8): a modified affected buffer is named in the one prompt; no leaves it modified and the state equal; yes saves exactly the named buffers, after the recheck, before any rank; an unaffected modified buffer stays modified. Same-named files in two directories are named by their unique buffer names; more than three gives the count form, the preview listing all." },
  { id = "EX-5", text = "Recheck (R7, DEC-033): a function answer changing MEMBERS (unvisited file on disk; live-buffer edit) re-asks, and the second yes applies ranks in the fresh order; rewriting a visited file on disk re-shows with the changed-on-disk blocker and no second prompt. The apply runs the rebuilt record (RV-014 F-2)." },
  { id = "EX-6", text = "Clean apply (R2, R3, R5): two files change only the planned IW_ lines (org-iw-test-changed-files); the order equals the intended order with every rank k × 1024; files go in files order, one put-ranks call each; clean buffers the run opened are killed, existing ones kept (DEC-031). Failure paths are PHASE-07." },
  { id = "EX-8", text = "Normalise (DEC-034): reads its queue with org-iw--read-session-queue; an already normal or empty queue reports \"already normal\" with no preview buffer (--redistribute returns nil); otherwise it relays and reports org-iw--redistributed-text." },
  { id = "EX-9", text = "Renames (D6): --batch-outcome → --file-outcome, --batch-report → --outcome-report (buffer heading groups); batch add renders one group and its tests pass with the renames; --refuse-no-room's text names org-iw-normalise; org-iw-cmd-test-refuse-no-room and org-iw-cmd-test-batch-no-room-fails-rest updated for it." },
]
verification = [
  { id = "VT-1", expects = "helper self-tests: changed-files and function answer", test_file = "test/org-iw-discovery-test.el", keywords = ["org-iw-test-changed-files", "org-iw-discovery-test-fixture-changed-files"], waived = false },
  { id = "VT-2", expects = "cancel, blockers, consent, naming, recheck", test_file = "test/org-iw-test.el", keywords = ["org-iw--redistribute", "org-iw-cmd-test-with-prompt-function-answer", "org-iw-cmd-test-redistribute-cancel-changes-nothing", "org-iw-cmd-test-redistribute-blocked-not-org", "org-iw-cmd-test-redistribute-modified-consent", "org-iw-cmd-test-redistribute-prompt-names", "org-iw-cmd-test-redistribute-stale-reshows"], waived = false },
  { id = "VT-3", expects = "clean apply minimal; kill opened", test_file = "test/org-iw-test.el", keywords = ["org-iw-cmd-test-redistribute-applies-minimal", "org-iw-cmd-test-apply-kills-opened-clean"], waived = false },
  { id = "VT-4", expects = "normalise relays and already-normal; preview content", test_file = "test/org-iw-test.el", keywords = ["org-iw-normalise", "org-iw-cmd-test-normalise-relays", "org-iw-cmd-test-normalise-already-normal", "org-iw-cmd-test-preview-content"], waived = false },
  { id = "VA-1", text = "Agent greps org-iw.el: org-iw-core-redistribution and the file loop are called only from org-iw--redistribute; no --batch-outcome or --batch-report remains; no rank arithmetic in the Redistribution section (ADR-004 rule 6)." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-07"
name      = "Flow failure paths"
objective = "Complete --redistribute's unhappy paths after a yes (design § 5.2.3 'The apply' and refusal table, § 5.5; REQ-020; D7; RV-014 F-5, F-6, F-14, F-17): stop at first trouble, the saved/modified/untouched partition, consent-save failure and re-dirtying, the fourth report group, the interrupted rule, and the reporting unwind-protect over consent saves and apply. Placed after PHASE-03 in execution order (ids are immutable; PHASE-03 was split at plan revision)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 completed; just gate green." },
]
exit_criteria = [
  { id = "EX-1", text = "Partition (REQ-020 AC1, R4, R5): a failing save (write-file-functions) on the second of three files gives saved / modified / untouched exactly; the third is not opened; the preview buffer becomes the report listing all groups; the refusal text as design § 5.2.3." },
  { id = "EX-2", text = "Consent-save failures: a failing save of a named buffer, and an after-save-hook that re-dirties it, each stop before any rank is written anywhere; the report names the file and the buffers already saved." },
  { id = "EX-3", text = "Fourth group (F-6): a consent save on the first file, then the second file fails → the report lists the consent-saved file under 'saved at your request before writing', and the refusal text counts it." },
  { id = "EX-4", text = "Quit (D7, F-14, F-17): a quit from after-save-hook on the second of three files → first saved, second interrupted (modified group), third stopped and unopened, and the quit propagates after the report; a quit inside the second file's change group → second stopped (untouched); a quit during a consent save → no rank written and the report lists buffers already saved. The interrupted rule compares the on-disk modtime noted before --file-outcome. Tests catch the quit with condition-case's quit handler: ert's should-error does not catch quit (it is not an error; verified in batch Emacs 31, 2026-10-07)." },
  { id = "EX-5", text = "Batch add's loop and its stopped rule are unchanged: org-iw-cmd-test-batch-summary-after-error and the batch-report tests pass (ISS-007 stays open)." },
]
verification = [
  { id = "VT-1", expects = "partition, stop at first trouble, report groups", test_file = "test/org-iw-test.el", keywords = ["org-iw--outcome-partition", "org-iw-cmd-test-redistribute-failure-partition", "org-iw-cmd-test-redistribute-report-consent-saves"], waived = false },
  { id = "VT-2", expects = "consent-save failure and re-dirtied", test_file = "test/org-iw-test.el", keywords = ["org-iw-cmd-test-redistribute-consent-save-fails", "org-iw-cmd-test-redistribute-consent-save-dirtied"], waived = false },
  { id = "VT-3", expects = "quit mid-apply: interrupted, rolled back, during consent save", test_file = "test/org-iw-test.el", keywords = ["org-iw-cmd-test-redistribute-quit-mid-apply", "interrupted"], waived = false },
  { id = "VA-1", text = "Agent reads --redistribute: the consent saves and the apply loop sit inside one unwind-protect that renders the report; (interrupted) is assigned only when the in-flight file's buffer is modified or its on-disk modtime changed." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-04"
name      = "Move, view and Continue handoffs"
objective = "Hand off from --move at no gap (design § 5.2.3 'The handoff'): INTEND by ID, placement functions for the view moves (D8), (redistributed DEPTH OUTCOMES) and nil → (unchanged DEPTH), --moved-text's redistributed case, --continue-place reordering after redistributed (RV-014 F-8), and Continue reporting before it visits via --visit-head (DEC-038, ISS-002). Docstrings of Move, Continue and the view moves name the handoff."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-07 completed; just gate green." },
]
exit_criteria = [
  { id = "EX-1", text = "Move, Continue and each view move (place before/after, up, down) at no gap reach the prompt; approval relays the queue with the entry at its intended slot and reports the moved text plus the redistribution summary; cancel and blockers leave state equal and do not navigate." },
  { id = "EX-2", text = "Continue at Soon into no gap from the head, approved: the visited entry is the new head, not the moved entry; the session holds its ID; the message ends with the Now 1/N text (PRD-001 § 6, DEC-038)." },
  { id = "EX-3", text = "Continue place and remove: the write text is built first; a refused head visit appends \"not visited: REASON\" and the save status survives (ISS-002); after a failed redistribution there is no visit and the session is unchanged (REQ-020 AC2, R6)." },
  { id = "EX-4", text = "Re-show (D8): a view 'before X' at no gap where X moves while asking applies before X's new slot; X leaving the queue refuses with nothing written." },
  { id = "EX-5", text = "The existing tests that asserted the no-room refusal on these paths are rewritten to expect the prompt (answered no: cancelled, state equal): continue-refuses-at-rank-limit, continue-refuses-without-gap, move-refuses-without-gap, move-command-no-room, the view step at position 3/4, view-place-refusals (design § 10)." },
]
verification = [
  { id = "VT-1", expects = "handoff from Move, Continue and view moves; cancel", test_file = "test/org-iw-test.el", keywords = ["org-iw-cmd-test-handoff-surfaces", "org-iw-cmd-test-continue-redistributes-then-visits-new-head", "org-iw-cmd-test-view-move-reshow-anchor"], waived = false },
  { id = "VT-2", expects = "report before visit; no visit after failure", test_file = "test/org-iw-test.el", keywords = ["org-iw--visit-head", "org-iw-cmd-test-continue-reports-before-visit", "org-iw-cmd-test-continue-no-visit-after-failure"], waived = false },
  { id = "VA-1", text = "Agent greps org-iw.el: --move is the only caller of --redistribute among Move, Continue and the view moves; --continue-place derives the new order for redistributed; no call of org-iw--visit precedes the write report in --continue-place or --continue-remove." },
]
specs        = []
requirements = []

