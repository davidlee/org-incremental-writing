[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "A test should pin that the mark belongs to its view; making org-iw--view-mark global survives"
detail = """
Expected (design § 5.2: org-iw--view-mark is buffer-local UI state): a mark in one queue's view is unaffected by another view.
Observed: every mark test uses one view; mutant defvar-local -> defvar passes 326/326. With a global mark, showing another queue's view clears this view's mark (its redraw finds no entry for the ID).
Fix: add org-iw-cmd-test-view-mark-is-per-view: mark c1 in ESSAYS, show DRAFTS, restore ESSAYS to the window (set-window-buffer), assert tags (("c1" . ">")) and place-before on a1 -> "Moved C to 1/3 (saved)". Verifier: passes on real code, kills the mutant."""
disposition = "fix-now"
response = "Fix now: add the per-view mark probe test."

