[[finding]]
id = "F-4"
status = "verified"
severity = "nit"
title = "View commands should share one fresh-state helper; four repeat id/scan/order/entry bindings"
detail = """
Expected (POL-002, DRY): one owner for 'row ID, fresh scan, the queue's order, entry found or refused'.
Observed: org-iw-view-open (org-iw.el:1047), --view-step (1058), --view-place (1094), org-iw-view-remove (1137) each bind id, scan, (org-iw--order scan queue) and (org-iw--view-entry ...); open and remove bind a local queue, step and place read org-iw--view-queue. --view-entry already owns find-or-refuse.
Fix: one helper (e.g. returning (SCAN ORDER) for the view's queue) used via pcase-let; use the queue binding consistently."""
disposition = "fix-now"
response = "Fix now (POL-002): one fresh-state helper for the four view commands."

