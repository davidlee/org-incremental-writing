[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "The mark's tag should show on every reprint; tabulated-list's inherited { and } erase it while b/a still act on the mark"
detail = """
Expected (design § 5.3, DEC-019): the mark is UI state shown as a tabulated-list tag; tag and org-iw--view-mark agree, so b/a never act on a mark the user cannot see.
Observed: org-iw-view-mode-map inherits tabulated-list-mode-map, whose { and } (tabulated-list-narrow/widen-current-column) call (tabulated-list-print t). That reprint drops the padding tag; org-iw--view-mark is untouched. --view-set-mark (org-iw.el:951-959) writes the tag and only --view-redraw (org-iw.el:985-986) re-tags. Same failure as RV-005 F-2 via another reprint path.
Proof (architecture reviewer, verifier re-ran): m on b1, call-interactively tabulated-list-widen-current-column -> tags ((("b1" . ">"))) -> nil, mark var "b1"; b on a1 -> "Moved B to 1/3 (saved)".
Fix: a buffer-local tabulated-list-printer that prints the entry then draws ">" when the row ID equals org-iw--view-mark, so every reprint shows the tag; --view-redraw then only clears a mark whose entry is gone. Test: } then assert --view-tags. Columns are unsortable (nil), so S/header sort is not a second path."""
disposition = "fix-now"
response = "Fix now: draw the tag from a buffer-local tabulated-list-printer keyed on org-iw--view-mark; --view-redraw only clears a gone mark; test } keeps the tag."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Fix now: draw the tag from a buffer-local tabulated-list-printer keyed on org-iw--view-mark; --view-redraw only clears a gone mark; test } keeps the tag."

[[finding.turn]]
