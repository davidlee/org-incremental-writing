note = "409272b: tabulated-list-printer org-iw--view-print-row; org-iw--view-tag-row sole tag owner; view-mark-survives-reprint red on old code; EX-4 control re-run fails both tests with the printer reduced. Gate 329/329 on 31.1 and 30.2 (seat re-ran)."

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "A test should pin where D puts point when rows are stale; two mutants of the GOTO-ID survive"
detail = """
Expected (design § 5.4 Remove): redraw with GOTO-ID = the next row's ID (else the previous), taken from the rows before the redraw.
Observed: org-iw-view-remove's (or (cadr (member id ids)) (cadr (member id (reverse ids)))) is untested where it matters: on fresh rows --view-redraw's same-line fallback lands on the same row. Mutants nil GOTO-ID and ids-from-scan-order both pass 326/326 (test reviewer; verifier confirmed).
Fix: add org-iw-cmd-test-view-remove-stale-goes-to-next-row: stale view rows B C A, truth A B C; D on c1 answered yes -> rows (a1 b1), point on a1. Passes on real code, kills both mutants."""
disposition = "fix-now"
response = "Fix now: add the stale-row D probe test."

