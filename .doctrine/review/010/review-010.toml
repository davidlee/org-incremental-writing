id    = 10
slug  = "design-review-of-sl-003"
title = "design review of SL-003"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = "Design amendment for DEC-020 (revision 49): § 5.2 --membership-queue ASK and --read-placement prompt, Move/Remove interactive specs; § 5.4 flowchart; § 7 DEC-020; § 9 tests; § 10 row. Checked against org-iw.el: --read-placement is the one placement prompt (Add, Continue, Move); Move and Remove resolve their queue through --queue-at-point. Zero findings."

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-003"

# Findings are append-only `[[finding]]` tables, added by `review raise`.
# Empty here at creation — a fresh review is Active, awaiting the raiser.
