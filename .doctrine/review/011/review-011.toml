[[finding]]
id = "F-13"
status = "verified"
severity = "nit"
title = "Expected a view buffer found by org-iw--view-buffer to be a working view; observed one whose major mode the user changed is still found and redrawn"
detail = """
`org-iw--view-queue` is permanent-local (org-iw.el:909), and lookup is by queue (:915-925). After `M-x fundamental-mode` in a view, `org-iw-list-queue` returns "Queue ESSAYS: 3 entries". The buffer stays in fundamental-mode, with no mark tag, and RET is `newline` (verifier probe c4.el). Design § 5.2 says only a new view is put in the mode.
"""
disposition = "tolerated"
response = """
Self-inflicted: the user must change the major mode of a special buffer by hand; killing the buffer recovers, and nothing is written wrongly (every action rescans, I12). The fix contradicts design § 5.2 ("only a new view is put in the mode") and would need a design amendment out of proportion to the hazard.
"""

