[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Expected design § 5.2/§ 5.4 to describe the shipped command and discovery helpers; observed drift in owners, signatures and the helper list"
detail = """
Verified by execution and against the cited lines (modelling reviewer, verifier):
- § 5.2 (design.md:385) says `org-iw--view-redraw` "re-tags the mark". Since RV-009 F-1, the view's printer `org-iw--view-print-row` (org-iw.el:962-969) draws the tag on every reprint. The redraw only clears a mark whose entry is gone (:1007-1008). Same behaviour, different owner.
- § 5.2 (design.md:272-276) gives `--scanned-entry-at (MARKER SCAN)`. The code is `(marker scan &optional queue)` and owns the "not in queue NAME" refusal (org-iw.el:722-747, e2db495). § 5.4 step 4 (design.md:473) still describes a separate refusal.
- § 5.2 (design.md:216) says `:outline (org-get-outline-path)` and "nothing else changes". Discovery wraps the path in `string-clean-whitespace` (org-iw-discovery.el:231-232, RV-006 F-4).
- § 5.2 and § 10 omit the helpers added during execution, each recorded in notes.md as a deviation that removes duplication: `--removed-text`, `--moved-text`, `--entry-marker`, `--queue-at-point`, `--empty-text`, `--continue-place`/`--continue-remove`, `--session-entry-p`, `--heading-or-refuse`, and the `--view-*` family (print-row, set-mark, rescan, refresh, revert, move, step, place, redraw-and-report, row-position).
"""
disposition = "design-wrong"
response = """
The code is right; each drift is a recorded, reviewed deviation (notes.md PHASE-04/05/06, RV-006 F-4, RV-009 F-1). Reconciliation brief: direct edit of design.md § 5.2 (redraw/printer ownership, `--scanned-entry-at` signature and refusal, the outline whitespace clean, the added helpers), § 5.4 step 4, and § 10's org-iw.el row.
"""

