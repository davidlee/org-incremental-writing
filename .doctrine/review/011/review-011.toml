title = "Expected every path the slice edits to be a design-target (§ 10, selectors); observed test/org-iw-test-helpers.el edited but undeclared"
detail = """
`git log e7213f2..HEAD -- test/org-iw-test-helpers.el` gives 83885ef (PHASE-06) and 136fe79 (RV-007 fixes). The file is in neither design § 10 (design.md:945-962) nor the slice's design-target selectors. The registry-based `doctrine slice conformance 3` does not list it, because the recorded deltas missed it. `--against e7213f2..HEAD` does list it undeclared. The registry's other 12 undeclared paths are all `.doctrine/` metadata (DEC-020, IMP-008, RV-010, design.md, notes.md, an observation), not code.
"""
disposition = "design-wrong"
response = """
The design, not the code, is behind: the helpers file is the test fixture's natural home (STD-004 mirrors tests; helpers are shared). Reconciliation brief: `doctrine slice selector add` design-target `test/org-iw-test-helpers.el` (load-bearing for conformance), mirrored by a § 10 row. The registry's `.doctrine/` undeclared paths are metadata and need no selector.
"""

