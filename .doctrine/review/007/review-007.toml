[[finding]]
id = "F-6"
status = "answered"
severity = "minor"
title = "The view should report scan problems like every other command; list-queue and g on a non-empty queue say nothing"
detail = """
Expected (SL-001 Messages convention): every command message carries '[N source problems ignored]' when the scan has problems.
Observed: corpus with A and two headings sharing ID b1 (2 problems): (org-iw-list-queue "q") returns nil, rows ("a1"); (revert-buffer) nil; (org-iw-visit-next "q") 'IW Q 1/1: A [2 source problems ignored]'. Entries vanish from the view unexplained. Design § 5.4 names only the empty-queue message (OQ-1 ruled literally): a design gap, not a defect.
Fix: list-queue and g report through org-iw--report (e.g. 'Queue NAME: N entries'), or a header-line count. Touches design § 5.4 and list-queue's documented nil return."""
disposition = "fix-now"
response = "User agreed (2026-10-03). Design § 5.4 amended (run re-locked, RV-008): list-queue and g report through org-iw--report, 'Queue NAME: N entries' ('1 entry') or 'Queue NAME is empty', carrying the scan-problem suffix. F-5's pin follows this."

