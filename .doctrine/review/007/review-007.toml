[[finding]]
id = "F-3"
status = "answered"
severity = "minor"
title = "The test fixture should spare queue views made outside it; it reuses and then kills a user's view"
detail = """
Expected (STD-001 item 1; corpus buffers are filtered by path for this reason): a user's live buffers survive a test.
Observed: test/org-iw-test-helpers.el (~80-90) kills views by major mode, and --view-buffer finds views by queue ID, so under interactive M-x ert a user's ESSAYS view is redrawn with test data and killed. Probe org-iw-cmd-test-fixture-spares-outside-views fails on pristine code. Batch runs unaffected.
Fix: record views existing on entry and kill only new ones; refuse or warn when a same-queue view exists."""
disposition = "fix-now"
response = "Fixture records the views that exist on entry, kills only new ones, and refuses to start when a view of the same queue already exists. Add the probe as a test."

