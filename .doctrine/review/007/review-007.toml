[[finding]]
id = "F-12"
status = "answered"
severity = "minor"
title = "org-iw--scanned-entry-at should refuse 'excluded' when the entry's own IW_<Q> line was dropped; with another valid membership it says 'not in queue'"
detail = """
Expected (design § 5.5, duplicated key or IW_<Q>+): from the source, Remove refuses 'excluded', as Add does via --check-heading (org-iw.el:429-437, org-iw-discovery-queue-lines).
Observed: heading with :IW_ARTICLES: 1, :IW_ARTICLES+: 2, :IW_ESSAYS: 5. (org-iw-remove "articles") and (org-iw-move "articles") refuse 'A is not in queue ARTICLES'; Add refuses 'excluded (duplicate-property)'. Interactively --queue-at-point picks ESSAYS without prompting, so the valid membership is removed unconfirmed. Without the ESSAYS line the refusal is correctly 'excluded'. Two implementations of 'excluded from Q at MARKER' (--check-heading; --scanned-entry-at QUEUE arm, org-iw.el:720-732) have drifted (POL-002). Probe: /tmp/claude-1000/-home-david-dev-org-incremental-writing/77e6c44f-2b3b-4602-85a1-4d95f9578322/scratchpad/rv007-arch/probe.el.
Fix: QUEUE arm refuses 'excluded' when org-iw-discovery-queue-lines finds lines for QUEUE, via one helper shared with --check-heading. Must stay queue-scoped (F-13). No design or API change."""
