[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Chooser order vs default: icomplete/vertico bubble default to top"
detail = '''
**Location.** design.md § 5.2 `org-iw--read-placement`: "completing-read \"Placement: \" over the labels, REQUIRE-MATCH t, in configured order (a completion table whose metadata sets display-sort-function to identity), default the default label." § 8 mitigation: "The table's metadata sets `display-sort-function` to `identity`. The trial checks it with the user's own completion UI."

**Governing source.** REQ-016 AC1 "A configured queue's Continue chooser shows its labels in configured order"; DEC-011 "RET choosing the default"; DEC-009 default End (the *last* standard label).

**Defect.** `display-sort-function` does not stop popular frontends from moving the DEFAULT to the top. Verified in Emacs 31.1 `icomplete.el` `icomplete--sorted-completions`: "Icomplete mode re-sorts candidates, bubbling the default to top" whenever a string default is given and the input is empty (icomplete, fido-mode; vertico does the same). With the standard vocabulary and default End, the chooser shows End, Soon, Later — not configured order — on every Continue. The obvious workaround (pass no DEF, map "" to the default) breaks DEC-011 under the same frontends, because there RET selects the first candidate (Soon). So the two requirements are in tension in common UIs, and the design defers the answer to the human trial, where it can only fail.

**Fix.** Decide in design, with the user: either (a) accept "default first, rest in configured order" as meeting REQ-016 and say so (and test the configured order of the *table*, not the display), or (b) keep configured order and mark the default by annotation/prompt text ("Placement (default End): "), accepting that RET in icomplete picks the first label. Record the choice (DEC or design § 7) and make the § 9 trial step 5 check the decided behaviour.
'''
disposition = "fix-now"
response = "Unchanged substance: user ruled RET = default (2026-10-01); DEC-011 amended; § 5.2/§ 7/§ 8 and trial step 5 record it. Route: review (settled in design review)."
