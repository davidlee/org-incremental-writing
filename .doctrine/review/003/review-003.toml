**Fix.** Add: `C-u` `call-interactively` Continue without a session refuses with the recorder asserting no prompt (answer nil); `C-u` Continue on a queue with bad vocabulary refuses before the prompt; `C-u` Add with an invalid typed queue ID refuses before the placement prompt (recorder sees exactly one prompt, the queue's).
