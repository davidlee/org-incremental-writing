**Location.** design.md § 9 Commands and § 5.4: "1. No session → refuse ... The interactive spec checks this before prompting." and "Refuses bad config or an unknown label before any scan"; for Add "With a prefix argument it then canonicalises the queue (`org-iw--queue-id`) and reads the placement."

