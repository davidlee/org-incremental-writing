[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "Vocabulary: nil vs absent, global-config blame, second plist reader"
detail = """
**Location.** design.md § 5.2 `org-iw--vocabulary`: "PLACEMENTS = the queue's :placements, else org-iw-placements. DEFAULT = the queue's :default; else, unless the queue has its own :placements, org-iw-default-placement; else the first label. Refuses, naming the queue, unless PLACEMENTS is a non-empty list ..." § 9: "Bad config refuses ... naming the queue: ... an empty list".

**Defects.**
1. *Absent vs nil is undefined.* `("TWEETS" :placements nil)` matches the customize type (verified: the plist widget accepts it). With `plist-get` it silently falls back to the standard vocabulary, while `org-iw-placements` set to nil refuses as "empty list". The § 9 "empty list" case is therefore reachable only through the global option, and the per-queue explicit empty list is silently ignored. Decide: `plist-member` semantics (explicit nil refuses) or document nil = absent.
2. *Blame for global config.* With `org-iw-placements` customised to `(("Soon" (after 2)) ("Later" (fraction 1 2)))` and `org-iw-default-placement` left at "End", every unconfigured queue refuses plain Continue with a message naming the *queue*, though the fault is in two global options. The refusal should name the source of the bad value (`org-iw-default-placement` / `org-iw-placements` vs the queue's `:placements`/`:default`).
3. *Second plist reader.* research.md Thread 2 says "`org-iw--configured-name` is the plist reader to generalise", but § 5.2/§ 10 add `org-iw--vocabulary` as a separate reader of the same `(alist-get queue (org-iw--configured-queues))` plist. Under POL-002 ("a reader of source state" is a concept; STD-004 item 5) the queue-config lookup should have one owner, e.g. `org-iw--queue-config QUEUE` used by both `org-iw--configured-name` and `org-iw--vocabulary`.

**Fix.** Specify plist-member semantics (or nil = absent) for `:placements`/`:default`; make the refusal name the option that supplied the bad value; route both readers through one queue-config accessor and list it in § 10.
"""
disposition = "fix-now"
response = "§ 5.2: org-iw--queue-config is the one queue-plist reader (configured-name built on it); present-but-nil :placements refused as empty (plist-member); refusals name the blamed source (queue NAME :placements / org-iw-placements / :default / org-iw-default-placement)."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "§ 5.2: org-iw--queue-config is the one queue-plist reader (configured-name built on it); present-but-nil :placements refused as empty (plist-member); refusals name the blamed source (queue NAME :placements / org-iw-placements / :default / org-iw-default-placement)."

