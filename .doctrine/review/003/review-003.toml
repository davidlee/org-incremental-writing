status = "verified"
severity = "minor"
title = "Command test of 5 cannot distinguish Soon from Later"
detail = """
**Location.** design.md § 9 Commands: "Continue with each standard placement on an unconfigured queue of 5: the resulting order (Soon → 3rd, Later → 3rd, End → last)".

**Defect.** With 5 members the target has 4 others: Soon `(after 2)` → depth 2, Later `(fraction 1 2)` → floor(4/2) = 2. Both land 3rd, so the command test cannot tell Soon from Later. Plausible bugs that pass it: the labels' placements swapped or both bound to the same form in the vocabulary lookup (e.g. `org-iw--placement` returning the first/default entry's placement for any label that matches by prefix), or Continue counting the target (floor(5/2) = 2, same answer). The defcustom literal pin covers the default value but not the label→placement lookup path through Continue.

**Fix.** Use a queue where every standard placement gives a distinct position and the fraction distinguishes "with" vs "without target", e.g. 8 members (7 others): Soon → 3rd, Later → floor(7/2)=3 → 4th (with target counted: floor(8/2)=4 → 5th), End → last.
"""
disposition = "fix-now"
response = "§ 9: standard-placement Continue test uses a queue of 8 (Soon 3rd, Later 4th, End 8th)."

