[[finding]]
id = "F-8"
status = "verified"
severity = "minor"
title = "Later is sooner than Soon in small queues; unstated, unpinned"
detail = """
**Location.** design.md § 5.5 Edge cases ("Clamping ... `(percent 0)` = front", "`(fraction 0 1)` and `(after 0)` both mean the front") and DEC-009 (Later = `(fraction 1 2)`).

**Defect (unstated consequence).** Under REQ-009's floor(f·N), Later in a 2-entry queue has N = 1 other → floor(1/2) = 0: the target goes to the front and Continue → Later reopens the same entry (unchanged, no write). In a 3-entry queue Later → depth 1 while Soon → depth 2 (the end), so "Later" comes back *sooner* than "Soon" for queues of up to 4 entries (5 entries: both depth 2). This is correct by REQ-009 but nowhere stated; the § 9 trial on a small queue will look like a bug, and no test pins it, so a later "fix" (ceil, min-depth 1) would slip in unreviewed.

**Fix.** State it as an edge case in § 5.5 and pin it in the core depth table (`(fraction 1 2)` with 1 other → 0). Optionally surface to the user whether a non-zero fraction should mean depth ≥ 1; if so it is a DEC-007 change, not an implementation choice.
"""
disposition = "fix-now"
response = "User accepted the behaviour (follows REQ-009 and DEC-009). Stated in § 5.5 edge cases; § 9 pins the 2-entry Later case."

