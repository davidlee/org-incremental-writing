[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Property test one-directional, no oracle self-test"
detail = """
**Location.** design.md § 5.5 "Core property (tested over random inputs, § 9). For any order and any placement, `place` returns one of: unchanged, when reorder equals ORDER; moved, when sorting ... equals reorder; no-gap, when the neighbours' ranks admit no integer strictly between them, or the limit is reached." § 9 "Property test (seeded, about 500 cases, no external library): random orders with ties and negative ranks ... Check the § 5.5 property".

**Governing source.** STD-001 item 2 (tested oracles: a helper deciding pass/fail for many tests has a self-test showing it detects what it claims); item 3 (guards killed).

**Defect.** (1) The property is stated one-directionally ("returns ... when"). A checker that only verifies each returned tag's own condition passes an implementation that returns `no-gap` too often (e.g. checks rank-at before the unchanged test, so an entry already in place between tied/adjacent neighbours gets `no-gap` instead of `unchanged`), or `moved` for a target already in place with a valid gap. The checker must be biconditional: unchanged iff the target's index equals the depth; no-gap iff no allowed rank exists; else moved. (2) The generator is specified as "ties and negative ranks" only; the precedence bug above and the limit cases are only reached if ranks include adjacent values and ±(2^53−1) neighbourhoods. (3) No self-test of the property checker is planned, though it is exactly the STD-001 item 2 oracle kind.

(Checked by prototype: a reference implementation of § 5.2 passed 20,000 random cases with ties, duplicate IDs, adjacent ranks and ±limit; the contract itself is sound — the gap is in the test specification.)

**Fix.** State the property as three iff-conditions with an independent no-gap oracle (neighbour ranks in `reorder` tied/adjacent, or depth 0 with first − 1024 < −(2^53−1), or depth = count with last + 1024 > 2^53−1). Specify the generator to draw from small ranges (forcing ties/adjacency) and from near ±limit. Add a self-test: the checker rejects a deliberately wrong `place` (e.g. one that ignores unchanged, one that always returns no-gap).
"""
disposition = "fix-now"
response = "Contest accepted. § 9 checker now in precedence order: unchanged ⇔ non-nil target and reorder = ORDER; no-gap ⇔ not unchanged and no allowed rank (A(5) T(5) B(6) (after 1) cited as unchanged); else moved with re-sort = reorder. Nil target checked via a fresh stand-in entry inserted at DEPTH. Self-test adds 'no-gap for an entry already in place'. Also fixed the F-6/F-8 wording leftovers (§ 5.5, § 9 global-option pin)."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "§ 9: property checked in both directions per outcome; generator includes ties, adjacent ranks, nil target and ranks near ±limit; checker self-test against three deliberately wrong results (STD-001 item 2)."

[[finding.turn]]
act = "contest"
role = "raiser"
note = """
The revised § 9 checker is wrong as written. It now rejects a correct `place`.

§ 9 says "`no-gap` ⇔ there is no integer strictly between the neighbours, or the limit is reached". That condition ignores the fact that `unchanged` takes precedence. Take ORDER = A(5) T(5) B(6) with placement `(after 1)`. T is already at depth 1, so the correct result is `unchanged`. Yet its neighbours among the others are 5 and 6, which admit no integer between them, so the right-hand side of the no-gap iff holds and the checker demands `no-gap`. I ran a prototype of § 5.2 with ranks in 0..3: 837 of 20,000 random cases had `unchanged` as the correct result while the no-gap condition also held. A checker written to the letter of § 9 fails a correct implementation. Or the implementer "fixes" it by making `no-gap` win, which is exactly the precedence bug F-4 was meant to catch.

Second, the generator now draws "random targets, nil included". The property, though, is stated through `reorder ORDER TARGET DEPTH` and "the target re-ranked", and neither is defined for a nil TARGET. For nil, the checker has to insert a fresh entry carrying RANK and compare its position against DEPTH.

Fix:
- State the oracle with precedence: unchanged ⇔ TARGET non-nil and its index in ORDER = DEPTH. no-gap ⇔ not unchanged ∧ (the depth's neighbours in OTHERS are tied or adjacent, or DEPTH = 0 ∧ first − 1024 < −(2^53−1), or DEPTH = |OTHERS| ∧ last + 1024 > 2^53−1, with empty OTHERS never no-gap). Otherwise moved, and re-sorting with the target (or a fresh entry for nil) at RANK puts it at DEPTH, with the others in their original order.
- Add "`no-gap` for an entry already in place between tied neighbours" to the self-test's wrong results.

Everything else in the F-4 fix holds: the generator ranges, the "in both directions" requirement and the self-test.
"""

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Contest accepted. § 9 checker now in precedence order: unchanged ⇔ non-nil target and reorder = ORDER; no-gap ⇔ not unchanged and no allowed rank (A(5) T(5) B(6) (after 1) cited as unchanged); else moved with re-sort = reorder. Nil target checked via a fresh stand-in entry inserted at DEPTH. Self-test adds 'no-gap for an entry already in place'. Also fixed the F-6/F-8 wording leftovers (§ 5.5, § 9 global-option pin)."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "§ 9 now checks the outcomes in precedence order: unchanged (non-nil target already in place) first, then no-gap only when not unchanged. That matches the § 5.2 prototype, which passed 20,000 fuzz cases, and the A(5) T(5) B(6) counterexample is cited as unchanged. A nil target is checked with a fresh stand-in entry. The self-test includes no-gap for an entry already in place."

