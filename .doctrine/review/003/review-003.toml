detail = """
**Location.** design.md § 5.4 Add: "SL-001's steps 1 to 6 are unchanged. Step 7 becomes: Placement: `end` when LABEL is nil, else `org-iw--placement` (which refuses before any write)." versus § 4 "Refuse config on use. The vocabulary is validated where it is read, before any prompt, scan or write." and § 7 "Continue's placement is resolved before the scan. Bad config fails fast and cheaply".

**Defect.** For Add the label is resolved at step 7, i.e. after the scan and after `org-iw--check-heading`. Concrete inputs: `(org-iw-add "ESSAYS" "Bogus")` with point on a heading already in ESSAYS returns "Already in ESSAYS at 2/3" and silently ignores the unknown label; with a broken `:placements` the same call scans first, then refuses. Continue and Add thus order the same check differently, and Add contradicts § 4. § 9 tests an unknown label from Lisp only for Continue.

**Fix.** Resolve the placement in Add right after `org-iw--queue-id` (before the scan) when LABEL is non-nil, as Continue does, so unknown labels and bad config refuse before any scan regardless of membership. Add § 9 tests: Lisp `org-iw-add` with an unknown label refuses before scanning (scan stub asserts not called), including on an existing member.
"""
