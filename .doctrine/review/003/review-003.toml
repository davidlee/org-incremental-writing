severity = "minor"
title = "Add prompt default drifts from DEC-011 (default End)"
detail = """
**Location.** design.md § 5.2 `org-iw--read-placement`: "Add's prompt uses it too, so its default is the queue's default label". DEC-011 choice: "org-iw-add appends; with a prefix argument it prompts for a placement from the chosen queue's vocabulary after the queue prompt (default End)."

