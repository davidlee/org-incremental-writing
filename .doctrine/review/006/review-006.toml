[[finding]]
id = "F-1"
status = "answered"
severity = "minor"
title = "delete-rank should refuse a read-only indirect buffer; it signals raw buffer-read-only"
detail = """
Expected: both write verbs share one preflight and treat a read-only buffer as the documented refusal "buffer is read-only" (org-iw-write.el docstrings :116, :145).
Observed: preflight (org-iw-write.el:73-74) checks only the base buffer's buffer-read-only. With a marker in a read-only indirect buffer over a writable base, delete-rank signals (buffer-read-only #<buffer ind>) (not org-iw-refusal); put-rank writes and saves because org-entry-put wraps org-no-read-only. Probe on Emacs 30 and 31 (scratchpad probe2.el). Text is restored by rollback. Unreachable from current commands (markers come from org-iw-discovery-resolve, base buffer), but delete-rank is public.
Fix: preflight also checks (buffer-local-value 'buffer-read-only (marker-buffer marker)); one test per verb."""
disposition = "fix-now"
response = "Preflight also refuses when the marker's own buffer is read-only; one test per verb (read-only indirect over writable base). Local to org-iw-write.el; docstrings already promise the refusal."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Preflight also refuses when the marker's own buffer is read-only; one test per verb (read-only indirect over writable base). Local to org-iw-write.el; docstrings already promise the refusal."

