[[finding]]
id = "F-3"
status = "open"
severity = "minor"
title = "Write layer should read Org structure only via discovery (ADR-003); delete-rank calls org-get-property-block"
detail = """
Expected (ADR-003 as amended by REV-002): every reader of Org structure lives in discovery behind public functions; mutation reads the entry only through them.
Observed: org-iw-write.el:164 calls (org-get-property-block) after org-entry-delete to check the drawer survived. Design § 5.2 (design.md:234) prescribes this exact code, so the locked design and the ADR disagree: drift between two binding sources.
Mitigation: it is a post-write invariant check, not an entry read for decision-making.
Resolution needs a choice: amend ADR-003 to allow post-edit invariant checks in mutation, or expose a discovery predicate and call it (touches the locked design)."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-4"
status = "answered"
severity = "nit"
title = "Outline should be clean text; a mid-heading cookie leaves a double space and a test pins it"
detail = """
Expected: discovery, the one Org reader, yields outline strings without Org artefacts, so the view (PHASE-06 --outline-text) never compensates.
Observed: org-get-outline-path strips a mid-heading cookie but keeps both surrounding spaces: '* Plan [1/3] [[..][Site]]' → "Plan  Site". test/org-iw-discovery-test.el:320-321 asserts the double space, pinning Org's quirk rather than org-iw behaviour. Nothing in PHASE-01..03 renders the outline.
Fix (before PHASE-06): normalise whitespace in --read-entry and assert the clean form."""
disposition = "fix-now"
response = "Normalise outline whitespace in discovery's --read-entry (one owner of Org reading) and assert the clean form, before PHASE-06 renders it."

