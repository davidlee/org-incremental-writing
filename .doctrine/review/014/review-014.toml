[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "Consented save may prompt or edit, breaking the one-prompt claim"
detail = "org-iw-write-save-file uses an ordinary save. save-buffer can ask questions of its own (require-final-newline set to ask, coding-system choices, backups) and run before-save-hook edits. A question breaks 'one y-or-n-p … no separate save question' (sec-05-3), and an unrecorded prompt blocks batch tests. A before-save-hook edit changes buffer text after the recheck, so the rebuilt record could be stale before the apply (R7). State how the save is bound (which saves it allows to prompt, or an inhibit), and whether the key is re-checked after the saves or the apply's per-entry expected-rank guard is relied on, with a test."
disposition = "fix-now"
response = "Contest accepted (coding-system questions depend on the text; consent saves are the first to save user-typed text). sec-05-2-2 now says so, replacing the false 'defaults ask none' and 'same exposure' claims. The consent saves run inside the reporting unwind-protect (sec-05-2-3 'After yes'; D7). A failed or quit consent save stops before any rank is written and lists the buffers already saved; the refusal table row reads 'fails, or is quit'. Test redistribute-quit-mid-apply has a variant that quits during a consent save."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "sec-05-2-2: org-iw-write-save-file returns (save-failed . still-modified) when a save hook re-dirties the buffer, and the run stops before writing (sec-05-5 edge case; tests save-file-* and redistribute-consent-save-dirtied). The text edits of a save hook are harmless: markers are resolved per file in the apply, after every consent save, and a changed IW line fails that file's :expected guard before anything is written. Emacs's own save questions are the same exposure every org-iw save has today, not org-iw prompts; the defaults ask none of them. Stated in sec-05-2-2."

[[finding.turn]]
act = "contest"
role = "raiser"
note = """
The still-modified result and the :expected reasoning cover the hook half; those parts I accept. The sentence added to sec-05-2-2 is wrong on two counts. (1) "Emacs's defaults ask none of them." The coding-system question depends on the buffer's content, not on any setting. Under defaults, an interactive save of a buffer whose text its buffer-file-coding-system can't encode goes through select-safe-coding-system and asks. Example: a file detected as iso-latin-1 or undecided, then the user types a non-Latin character. In batch it picks without asking. I checked: Emacs batch saved a latin-1 org file with an added emoji without asking. That is why the tests can "rely on the defaults", but it says nothing about interactive use. (Separately, org-mode inherits require-final-newline = t, which adds the newline silently rather than asking. That part is fine.) (2) "the same exposure every org-iw save has today" is also false. Today org-iw saves only buffers that were clean before its own edit, and those edits are ASCII (rank, ID, drawer), so the text is always encodable. A consent save is the first time org-iw saves text the user typed, which is exactly the case where the question appears. Consequence: the question appears after the user's yes, and C-g there is a quit during the consent phase. sec-05-5's quit edge case and D7 cover only "during the apply". The buffers already consent-saved then go unreported, which contradicts F-6's "every stop case". Resolution: correct the sentence. Then either (a) accept Emacs's question, put the consent-save loop inside the same unwind-protect that renders the report (listing what was saved so far), and add a quit-during-consent-save test, or (b) add an encodability pre-check (e.g. unencodable-char-position against buffer-file-coding-system) as a file problem, so the preview blocks instead.
"""

