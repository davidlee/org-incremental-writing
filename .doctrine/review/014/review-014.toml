[[finding]]
id = "F-9"
status = "verified"
severity = "major"
title = "Joining entry's marker is unspecified in the apply; from an indirect buffer it breaks put-ranks"
detail = """
sec-05-2-3 (the apply) says the per-file function "resolves each change's marker with org-iw--entry-marker against the recheck's scan". The joining token (org-iw--joining) is not an org-iw-entry, and with ID nil it cannot be resolved at all. So the design doesn't say which marker the joining change uses. The only candidate is the token's own marker, from org-iw--target-at-point. Code: org-iw--target-at-point (org-iw.el:174-185) returns `(point-marker)` in the CURRENT buffer, and org-iw-add's docstring promises "indirect buffers work". Members are resolved by org-iw-discovery-resolve, which always gives base-buffer markers (org-iw-discovery.el:551-572), and put-ranks requires "Every MARKER is in the same buffer; else it is an error" (sec-05-2-2). sec-05-2-2's "Why one buffer" bullet assumes every redistribution marker comes from resolve, which is false for the joining entry. Scenario: labelled Add of a heading from an org-tree-to-indirect-buffer view, at no gap, in a file holding other members whose ranks change. After yes, any consent saves run, earlier files are written, and then put-ranks signals a plain `error`. --file-outcome doesn't catch it (only org-iw-refusal and file-error), so it propagates mid-run. A related gap: a read-only indirect buffer for the joining marker is not a file problem (file-problems looks only at the base buffer), so the preview approves and the preflight refuses mid-run. STD-001 item 5 requires indirect and narrowed fixtures for buffer-reading code, but no section-9 test builds either for the flow. Resolution: state that the joining change uses the token's marker, re-homed to the base buffer (`(copy-marker (marker-position m))` in org-iw-discovery-base-buffer; indirect buffers share text, and a document marker already is one). Add the joining marker buffer's read-only state to the preview problems. Add add-handoff tests from an indirect and from a narrowed buffer.
"""
disposition = "design-wrong"
route = "review"
response = "Confirmed: target-at-point returns a current-buffer marker (org-iw.el:174-185). D9: the apply re-homes the joining token's marker to the base buffer (sec-05-2-3); sec-05-2-2 'Why one buffer' corrected. org-iw-write-file-problems takes BUFFER, which may be indirect: read-only of base or BUFFER holds, absorbing --check-file's separate indirect check. The preview passes the joining marker's buffer, so a read-only indirect is a blocker. Tests add-handoff-indirect and add-handoff-narrowed (STD-001 item 5), with a read-only-indirect variant."

