[[finding]]
id = "F-10"
status = "verified"
severity = "minor"
title = "INTEND on the re-show path is specified only for Move"
detail = """
sec-05-2-3 specifies the move INTEND fully: find by ID in the fresh scan, then depth = placement-depth PLACEMENT over (1- (length order)). For a pending add, sec-05-2-1 gives only `(org-iw-core-reorder order JOINING depth)`. The token has no placement or depth slot, so it is unstated whether depth is fixed from the first (no-gap DEPTH) or recomputed from the placement. It is also unstated whether INTEND re-runs --add-entry's own checks against the fresh scan: already a member, an excluded IW line (org-iw--excluded-types), or a shared ID (org-iw.el:466-473). On the re-show path (key changed, which sec-05-4 says happens when the user edits while asked) this matters. (1) A fraction or percent label ("Later" = (fraction 1 2)) gets a stale depth when the member count changed. (2) If the user enrolled the entry by hand while asked, the fresh order holds both the member and the token, and the plan writes two ranks for one entry. The write's :expected :absent then refuses that file mid-run, after earlier files were written. The view moves have the same weakness: org-iw-core-beside and org-iw-core-step turn "before X" and "up one" into `(after N)` against the ORIGINAL order. A re-show after X moved therefore places by stale index while PENDING still says "before X" (R2: intended order). Resolution: give the add INTEND the placement and have it recompute depth over (length order), refusing, as --add-entry does, when the entry is now a member, excluded or shared-ID. For view-relative moves, either recompute the placement from the anchor's ID in the fresh scan or refuse on re-show. Add one re-show test for Add.
"""
disposition = "fix-now"
response = "Contest accepted. org-iw--check-joinable now takes (scan order queue marker document), runs at MARKER, and re-reads ID and file there on every scan, so the token's ID is refreshed and an entry enrolled by hand while asking is found ('already in Q') before anything is written. The add INTEND calls it at the token's marker (sec-05-2-3)."

