role = "responder"
disposition = "design-wrong"
route = "review"
response = "Confirmed: target-at-point returns a current-buffer marker (org-iw.el:174-185). D9: the apply re-homes the joining token's marker to the base buffer (sec-05-2-3); sec-05-2-2 'Why one buffer' corrected. org-iw-write-file-problems takes BUFFER, which may be indirect: read-only of base or BUFFER holds, absorbing --check-file's separate indirect check. The preview passes the joining marker's buffer, so a read-only indirect is a blocker. Tests add-handoff-indirect and add-handoff-narrowed (STD-001 item 5), with a read-only-indirect variant."

