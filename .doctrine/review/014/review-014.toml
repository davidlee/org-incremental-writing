[[finding]]
id = "F-14"
status = "verified"
severity = "minor"
title = "A quit while a file saves puts it in the wrong partition; D7 is untested"
detail = """
D7 and sec-05-5 (quit/error during the apply): "the files already done stand, and the rest are (stopped)". Under REQ-020 (sec-05-2-3 Partition), (stopped) counts as untouched. R4 claims the partition is exact. Code: atomic-change-group rolls back on a quit inside the edits, so that window is safe. A quit during org-iw-write--save (save-buffer, or before-save/after-save hooks such as formatters), or after the save but before --file-outcome returns, is different. The edits stand, the file may already be saved, and no outcome is recorded: --file-outcome's value comes from the unwind-protect form, which never returns (org-iw.el:655-680). Batch add's unwind-protect, which D7 copies (org-iw.el:765-776), marks every file without an outcome `stopped`. So the in-flight file is reported "untouched" while its buffer holds rank edits, or its disk does. A user restoring from that report would skip the one file that did change. No sec-09 test exercises D7. Resolution: classify the in-flight file from observed state, e.g. modified-p on its buffer, or label it "interrupted: check this file". Add a test that quits from write-file-functions or after-save-hook on the second file and asserts the partition.
"""
disposition = "fix-now"
response = "Contest accepted. The in-flight file is (interrupted) only if its buffer is modified or its visited-file modtime changed (a save ran); a quit inside the change group rolls back and stays (stopped), untouched (sec-05-2-3 'Interrupted'; D7). Batch add keeps its own loop and stopped rule, so org-iw-cmd-test-batch-summary-after-error stays green. Its sibling defect is captured as ISS-007. Test redistribute-quit-mid-apply has a rolled-back variant. Also folded in from the verify notes: the sec-08 risk row now reads 'redraws after a clean apply' (F-16), and sec-06 lists the DEC-036 wording update for reconcile (F-12)."

