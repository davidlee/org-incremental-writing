role = "raiser"
note = "DEC-029 amended; sections 1, 4, 5.2–5.5, 6, 7, 9 and 10 read back consistent with consent-in-prompt."

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Apply must use the rebuilt record, not the previewed one"
detail = """
sec-05-2-3 says the apply resolves "each change's marker against the recheck's scan". The changes it applies are not named. The previewed record's entries come from the first scan. With equal keys the plans are equivalent, but the entries are different struct objects. The apply should state that it uses the rebuilt record (fresh scan, fresh entries), so resolution and expected ranks come from one scan.
"""
disposition = "fix-now"
response = "sec-05-2-interfaces 5.2.3 now states that the apply runs the rebuilt record from the recheck, so changes, expected ranks and markers come from one scan."

[[finding.turn]]
act = "raise"
role = "raiser"

