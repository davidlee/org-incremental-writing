role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "D8: --move takes a placement or a function of (ORDER ENTRY). The view moves pass functions: the anchor is found by ID per scan (refusing 'X is no longer in queue Q'), and up/down step from the fresh index. The joining token keeps its placement. The add INTEND re-runs the extracted org-iw--check-joinable, so an entry that became a member while asking refuses 'already in Q', as do excluded and shared-ID entries, and depth is recomputed over the fresh count. Tests add-reshow-recomputes (with an enrolled-while-asking variant) and view-move-reshow-anchor."

[[finding.turn]]
act = "contest"
