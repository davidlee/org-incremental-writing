[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "F-1 Denote document can't leave its last queue"
detail = "org-iw-write-delete-rank refuses when the deletion empties the drawer (org-iw-write.el:146-166); a Denote note's drawer holds only IW_ lines (I2), so Remove / Continue→Remove fail with 'IW_J not deleted alone'. Probe /tmp/p/f.el."
disposition = "fix-now"
route = "review"
response = "Design § 5.2 delete-rank rule: a document's emptied drawer goes; headings keep the guard; I7; § 9 Remove/Continue→Remove and undo tests. DEC-022 amended (user 'yes')."

[[finding.turn]]
act = "raise"
role = "raiser"

