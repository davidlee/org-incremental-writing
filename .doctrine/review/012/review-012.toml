id = "F-4"
status = "verified"
severity = "major"
title = "F-4 Identity of a slotless document undefined; readers disagree; DEC-022 vs DEC-021"
detail = "In a heading-first file entry-id at point-min reads the heading's :ID:, --id-positions counts point-min without a slot check, and --add-entry needs a Denote id no public reader returns (STD-004 §2). Add-document on a Denote note whose first heading has an :ID: refuses as shared. DEC-022 says no ID; DEC-021 says Denote identifier."
disposition = "fix-now"
route = "review"
response = "New public org-iw-discovery-document-id, slot-gated for :ID:; entry-id, --id-positions, tally and --add-entry read through it; DEC-022 wording reconciled with DEC-021 (user 'yes'); § 9 heading-first Denote test."

