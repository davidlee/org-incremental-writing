[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "locate resolves non-member headings and case-insensitive IDs"
detail = "[reviewer F-1] org-find-entry-with-id returns the first :ID: match, case-insensitively, including headings without IW properties. A copied subtree makes Continue write IW_<Q> onto the copy (verified: find x1 -> Copy; find 'abc' -> :ID: ABC). Violates I2/I4, REQ-004, REQ-007."
disposition = "fix-now"
response = """
Prose fix stands: id-count with key case-insensitive, value case-sensitive, org-at-property-p, in the widened base buffer; resolve never uses org-find-entry-with-id. Probe: must hold against a copied subtree carrying the same ID in the same file (with and without memberships), a case-variant ID value only, a lowercase id key, and a copy hidden by narrowing or seen through an indirect buffer; need not hold against a copy of the ID on a non-member heading in another file, which resolve never looks at. Criterion must assert that resolve refuses (ambiguous or not found) in each adversary case and that Continue then writes nothing. Host phase constraint: the phase that lands resolve, after the scan and id-count exist.
"""
route = "probe"

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
