title = "Expected a buffer the batch opened and left modified to be reported (DEC-026, § 5.4 step 3.6); observed it kept silently for existing/failed outcomes"
detail = """
org-iw--batch-trouble-p (org-iw.el:593) flags only failed or added-and-unsaved; --call-in-file-buffer (:635) keeps a modified opened buffer. Probe h2/p6: an org-mode-hook dirties the opened buffer of an existing member → outcome (existing), buffer live and modified, no report buffer. Probe h1: a refused file's report line gives only the refusal, not that its buffer was left open. Conformance gap against the locked design.
