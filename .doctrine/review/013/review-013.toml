title = "reconciliation review of SL-004"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Conformance audit of SL-004 over 69117cf..HEAD (all of org-iw-discovery.el, org-iw-write.el, org-iw.el, the four test files, the justfile, flake.nix and the README), against the locked design, DEC-021..028, RV-012, ADR-001..004, POL-001..003 and STD-001..004. Evidence:
- the STD-003 scaled-up roster (opus modelling, test with a mutation pass, legibility; opus verifier);
- slice conformance (10 conformant, 0 undelivered);
- the gate both ways (Denote dir set by hand, and unset);
- test-each ×4;
- verify-vt (11 PASS).
20 findings, all verified: 13 fix-now (d65edcc), 4 design-wrong (brief), 2 follow-up (ISS-005, ISS-006), 1 tolerated. No blocker.
"""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-004"

[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Expected an interrupted batch to say it stopped (DEC-028 partial completion); observed the same summary as a complete run"
detail = """
org-iw.el:743 (unwind-protect cleanup) and org-iw--batch-summary (:597). Probe (modelling p2/d3, verifier rerun): a quit or wrong-type-argument on file 2 of 3 prints "Added 1 to J, 0 already present, 0 failed, 0 unsaved (not atomic)", with no report buffer. The files not attempted are invisible. Interactively, the command loop's Quit/error message then overwrites the echo area; *Messages* keeps the summary. Design § 5.4 step 4 / DEC-028.
"""
disposition = "fix-now"
response = """
d65edcc. After a quit or an uncaught error, org-iw-add-files gives every file without an outcome the outcome (stopped). The summary reads "…, N unsaved, stopped after K of M files (not atomic; see *org-iw batch*)", and the report lists the stopped files ("not added: the batch stopped"). Then the signal propagates. Test: org-iw-cmd-test-batch-summary-after-error. The quit message overwriting the echo area is accepted: the report buffer and *Messages* are the lasting record. User approved the design delta (2026-10-05). Design § 5.3/§ 5.4 step 4 go to reconcile.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
d65edcc. After a quit or an uncaught error, org-iw-add-files gives every file without an outcome the outcome (stopped). The summary reads "…, N unsaved, stopped after K of M files (not atomic; see *org-iw batch*)", and the report lists the stopped files ("not added: the batch stopped"). Then the signal propagates. Test: org-iw-cmd-test-batch-summary-after-error. The quit message overwriting the echo area is accepted: the report buffer and *Messages* are the lasting record. User approved the design delta (2026-10-05). Design § 5.3/§ 5.4 step 4 go to reconcile.
