d65edcc. org-iw--batch-outcome owns visiting the file, the catch, the kill rule and the mark. An outcome ends in `left-open` when the batch opened the buffer and left it modified, whatever the outcome. Such a file counts as unsaved and as trouble, and its report line says "buffer left open, modified". Test: org-iw-cmd-test-batch-reports-buffer-left-open. The outcome shape (§ 5.3) goes to reconcile.
"""

