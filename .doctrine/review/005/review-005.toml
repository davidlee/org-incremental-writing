[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "F-1 RET loses the view's window point"
detail = "Redraw after org-iw--visit OTHER-WINDOW runs with the source window selected; tabulated-list-print erase-buffer resets the view window's point to 1 (tl.el, Emacs 30.2 and 31.1). Same for org-iw-list-queue on an already-shown view. sec-05-4."
disposition = "fix-now"
response = "Design fixed in prose (org-iw--view-redraw sets point in every window showing the view; RET redraws after visit). Must hold against tabulated-list-print erasing the buffer while the view sits in an unselected window (RET with the source window selected, and org-iw-list-queue on an already-shown view). Need not hold against the user moving point by hand. Criterion: an ERT test shows the view in an unselected window, runs RET and org-iw-list-queue, and asserts the view window's point stays on the target row; it must fail with the point-restoring step removed. Host phase: the one that implements the view redraw helper and RET."
route = "probe"

