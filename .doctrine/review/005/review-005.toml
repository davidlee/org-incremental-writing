[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "F-2 g via tabulated-list-revert-hook wipes the mark tag"
detail = "tabulated-list-revert runs the hook then (tabulated-list-print t) again (tabulated-list.el 31.1:393-400), erasing tags set by the hook. sec-05-3/05-4/09."
disposition = "fix-now"
response = "Design fixed in prose (g uses a buffer-local revert-buffer-function that calls org-iw--view-redraw; tabulated-list-revert-hook is not used). Must hold against tabulated-list-revert reprinting after its hook and so erasing the mark tag. Need not hold against a marked entry that leaves the queue between redraws (the stale-row rule covers that). Criterion: an ERT test marks a row, runs g, and asserts the mark is still shown and still used by the next placement; it must fail if g is bound to tabulated-list-revert with the mark restored in the hook. Host phase: the one that implements mark and g."
