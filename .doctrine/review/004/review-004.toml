id    = 4
slug  = "reconciliation-review-of-sl-002"
title = "reconciliation review of SL-002"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-002"

[[finding]]
id = "F-1"
status = "open"
severity = "major"
title = "Expected every SL-002 VT keyword to name test names or test-code symbols (STD-002 item 1) and verify-vt to pass; observed PHASE-02 VT-1/VT-2 fail and several rows key on message text"
detail = """
`doctrine slice verify-vt 002`: PHASE-02 VT-1 FAIL (`no room at the end` absent), VT-2 FAIL (`Moved A to end` absent). Both strings left test/org-iw-test.el in 126e91f (PHASE-04), as RV-003 F-9 planned the message change, so the rows were orphaned by design.
STD-002 (scope: every VT authored from SL-002 on) item 1 forbids user-facing message text as a keyword. Rows that pass but key on message text: PHASE-02 VT-1 `is empty`; PHASE-03 VT-1 `:placements:`, `org-iw-placements:`, `org-iw-default-placement:`; PHASE-03 VT-2 `Placement: `; PHASE-04 VT-1 `Moved E1 to Soon`, `already at End`; PHASE-04 VT-2 `already at Soon`; PHASE-06 VT-1 `Added to ESSAYS at Soon`.
The earlier per-phase claim "all VT checks pass" was wrong: it was checked per phase before PHASE-04 changed the messages, and not re-run after (STD-002 item 4).
Verified by the verifier (opus) and by re-running verify-vt."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-2"
status = "open"
severity = "major"
title = "Expected the property checker's self-test to show the `moved` arm rejects a wrong rank (STD-001 item 2); observed deleting the moved-arm checks leaves the suite green"
detail = """
test/org-iw-core-test.el ~345-351 (moved arm of org-iw-core-test--check-place), ~381-399 (self-test).
Mutants that survive the whole suite (test reviewer, confirmed by the verifier): H3 replace the `unless (equal ... wanted)` sort check with `(ignore moved wanted)`; H2 drop the `org-iw-core-rank-p` check on the moved rank; H1 drop the `(pred (eql depth))` depth check on moved results.
Cause: none of the four wrong placers in the self-test (design § 9) ever returns a `moved` result with a bad depth or rank, and the self-test asserts only "at least one rejection" overall. Production code is still covered by example tests (3584, -1536), so no user-visible risk; the oracle's main arm is unverified."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-3"
status = "open"
severity = "minor"
title = 'Expected one owner of the "Queue NAME is empty" report (POL-002); observed the format string at two call sites'
detail = 'org-iw.el:494 (org-iw-visit-next) `(org-iw--report scan "Queue %s is empty" (org-iw--queue-name queue-id))` and org-iw.el:561 (org-iw-continue) `(org-iw--report scan "Queue %s is empty" name)`. The Continue copy is new in SL-002 (design § 5.4 step 4). POL-002 duplication is fix-now unless waived (STD-003).'

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-4"
status = "open"
severity = "minor"
title = """Expected a test that plain Add appends when the queue's default is not End (DEC-011 as amended, § 9 "plain Add appends"); observed no such test"""
detail = "org-iw.el ~430: mutant replacing `'(nil . end)` with `(cons nil (cdr (org-iw--placement queue-id nil)))` — plain Add uses the queue default but keeps the plain message — survives. Every plain-Add test runs with the default End, which is indistinguishable from append. Behaviour is correct today; the user-ruled behaviour (RV-003 F-5) is unpinned."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-5"
status = "open"
severity = "minor"
title = "Expected Continue's and Add's docstrings to list every refusal accurately (PHASE-04 EX-6, ISS-001 Continue half); observed omissions and two wrong claims"
detail = """
org-iw.el ~539-545 (Continue): the write-refusal list still omits the read-only buffer (org-iw-write.el:72) and the unrecognised property drawer (:78-79) — exactly the two ISS-001 names — and also the resolve refusals (org-iw-discovery.el ~442/446/452) and the not-in-Org-mode scan refusal (~395). It also says an unknown LABEL is "checked before the prompt"; only config is checked before the prompt (a typed label is REQUIRE-MATCH; a Lisp label is checked before the scan).
org-iw.el ~411-413 (Add): implies a plain Add refuses misconfigured placements; plain Add never reads the vocabulary (design § 5.4: `end` when LABEL is nil) — probe: `:placements nil` plus plain Add succeeds.
notes.md (PHASE-04, Harvest Open) records ISS-001's Continue half as fixed; it is not."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-6"
status = "open"
severity = "minor"
title = "Expected C-u Add to refuse an invalid queue ID before the placement prompt (§ 5.4: canonicalise, then read the placement); observed this ordering unpinned"
detail = "org-iw.el ~426: mutant `(org-iw--read-placement (or (org-iw-core-queue-id queue) queue))` survives; it prompts for a placement before refusing."

[[finding.turn]]
