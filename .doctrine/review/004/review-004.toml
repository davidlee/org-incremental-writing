[[finding]]
id = "F-8"
status = "open"
severity = "minor"
title = 'Expected one "changes nothing" oracle with self-tests (POL-002 via STD-001 item 7, item 2); observed four overlapping state checks, two without self-tests'
detail = "test/org-iw-test.el: `--should-write-nothing` (~975, new in SL-002) repeats the state comparison inside `--should-change-nothing` (~996); `--should-refuse` (~415) and `--should-be-no-op` (~388) repeat it inline. Mutants dropping the session/shown checks from `--should-change-nothing` (H9) and the substring check from `--should-refuse-cleanly` (H8) survive."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-9"
status = "open"
severity = "minor"
title = "Expected the property generator's guard to fail if the generator loses its edge cases; observed it counts outcomes only"
detail = "test/org-iw-core-test.el ~306, ~379. Generator mutants survive: no near-limit ranks (G1), never a nil target (G2), orders of length <= 2 (G4), only `end` placements (G5), no ranks at exactly ±limit (G6), `after` only, small ranks only. Today's distribution does reach every § 9 case (measured: 192 nil targets, 90 ties, 340 negative, 265 near-limit of 500), so this is a regression guard, not a current gap."

[[finding.turn]]
act = "raise"
role = "raiser"

