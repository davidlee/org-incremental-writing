[[finding]]
id = "F-18"
status = "open"
severity = "minor"
title = "Expected design § 5.2/§ 8 to name the sort metadata the chooser needs; observed it names only display-sort-function, while icomplete and fido order by cycle-sort-function"
detail = 'org-iw.el `org-iw--read-placement` sets both `display-sort-function` and `cycle-sort-function` to `identity`. Design § 5.2 ("a completion table whose metadata sets display-sort-function to identity") and § 8 (same) omit cycle-sort-function. Without it, `completion-all-sorted-completions` (Emacs 30 minibuffer.el:1806, 31 :1929) sorts by length/alpha/history in icomplete and fido. Confirmed in a real terminal on 30.2 and 31.1 by the modelling reviewer (configured order, default first under icomplete/fido; RET picks the default). The code is right; the locked design under-specifies.'

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-19"
status = "open"
severity = "minor"
title = 'Expected PRD-001 OQ-3 to record its settlement; observed it still open ("Confirm before the session slice")'
detail = 'PRD-001 § open questions, OQ-3: "Default placement depths for the standard Soon / Later / End vocabulary (brief suggests after-2, halfway, tail). Confirm before the session slice." DEC-009 (accepted, decided_by user) settled it: Soon (after 2), Later (fraction 1 2), End end, default End; SL-002 implements it and pins the defaults (org-iw-cmd-test-placement-options-defaults).'

[[finding.turn]]
act = "raise"
role = "raiser"

