detail = 'org-iw.el `org-iw--read-placement` sets both `display-sort-function` and `cycle-sort-function` to `identity`. Design § 5.2 ("a completion table whose metadata sets display-sort-function to identity") and § 8 (same) omit cycle-sort-function. Without it, `completion-all-sorted-completions` (Emacs 30 minibuffer.el:1806, 31 :1929) sorts by length/alpha/history in icomplete and fido. Confirmed in a real terminal on 30.2 and 31.1 by the modelling reviewer (configured order, default first under icomplete/fido; RET picks the default). The code is right; the locked design under-specifies.'
disposition = "design-wrong"
response = "The code is right (verified on 30.2/31.1 under default completion, icomplete, fido, fido-vertical); the locked design under-specifies. Reconcile: design § 5.2 (read-placement) and § 8 (chooser order) name both display-sort-function and cycle-sort-function, with the reason. See the Reconciliation Brief."

