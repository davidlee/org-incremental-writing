[facet]                         # every field typed; seeded empty (captured later)
context = "ADR-003 requires four layers with fixed dependency direction."
choice = "org-iw-core.el (pure: queue-id rules, property classification, rank parse, entry struct, ordering, rank allocation); org-iw-discovery.el (sources, reads, resolution by ID, problems); org-iw-write.el (one-property writes, ID ensure, ADR-002 save policy); org-iw.el (package header, defcustoms, session, commands). Each requires only files beneath it; org-iw-core requires no org."
alternatives = ["single file with sections", "finer split (config/session files) now"]
rationale = "One file per layer makes ADR-003 checkable by require graph; finer split is premature (POL-003)."
