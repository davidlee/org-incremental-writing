context = "REQ-019 AC2 requires a stale plan to be re-previewed; DEC-027 is one scan per operation (SL-006 research X6)."
choice = "On approval org-iw rescans and compares each member's (ID, file, rank) with what the preview showed; any difference re-previews and re-asks. The per-entry expected-value compare-and-set remains the write-time guard."
alternatives = ["rely on write-time compare-and-set only", "file modtime comparison"]
rationale = "Plain-data equality needs no new mechanism and catches order changes the per-entry guard would only meet mid-apply."
consequences = ["Two scans per redistribution (acceptable under DEC-027 scale)"]
