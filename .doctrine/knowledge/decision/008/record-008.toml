[facet]                         # every field typed; seeded empty (captured later)
context = "REQ-016: each queue may configure labels, placements and default; unconfigured queues use standard defaults. DEC-002 left org-iw-queues' plist open for this."
choice = "org-iw-queues entries gain :placements, a list of (LABEL PLACEMENT) in chooser order, and :default, a LABEL (absent -> the first placement). Queues without :placements use the defcustoms org-iw-placements and org-iw-default-placement. Labels live only in config; entries never store them."
alternatives = ["first placement is always the default (cannot order chooser independently)", "standard vocabulary as a defconst (not user-adjustable globally)", "separate defcustom per queue aspect"]
rationale = "Extends DEC-002 without migration; global defcustoms let a user set one vocabulary for all unconfigured queues with no new logic beyond a fallback lookup."
consequences = ["renaming a label or queue display name never touches entries", "Add-at-placement reads the same vocabulary"]
decided_by = "agent; user did not object (2026-10-01)"
decided_on = "2026-10-01"

