tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "REQ-012: report additions, existing memberships and failures; partial completion stated; not atomic. REQ-021: save policy per file."
choice = "A progress reporter runs during the loop. At the end the echo area shows counts (added, already present, failed, unsaved) and says the operation is not atomic. When any file failed or was left unsaved, a *org-iw batch* buffer lists each such file with its reason and is displayed. The command returns the summary."
alternatives = ["echo only", "always show the report buffer"]
rationale = "The echo area can't hold per-file reasons at corpus scale; a clean run needs no buffer."
consequences = ["Report data is built as plain data, so tests assert it without reading the echo area"]
