[facet]                         # every field typed; seeded empty (captured later)
context = "REQ-019 AC4/AC5 require unwritable targets to be reported before any write; org-entry-put silently ignores read-only buffers."
choice = "The preview lists every unwritable file, read-only buffer and changed-on-disk buffer alongside the unsaved buffers (DEC-029). Approval is refused while any remains; the user resolves and re-previews."
alternatives = ["write the writable subset and report the rest", "refuse at apply time only"]
rationale = "Same mechanism and report as DEC-029; no partial redistribution that would leave the queue half re-laid."
consequences = ["The shared write preflight becomes reason-returning (preview) and refusing (apply), one implementation (POL-002, research X2)", "The buffer-read-only check stays load-bearing"]
