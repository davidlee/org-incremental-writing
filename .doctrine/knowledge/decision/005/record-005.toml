[facet]                         # every field typed; seeded empty (captured later)
context = "PRD-001 OQ-4; REQ-014 requires the retained (queue, entry) be visible."
choice = "A single global session (queue ID, entry ID, title) in memory, set by visit/continue/opening from a view, cleared by org-iw-end-session. Shown via global-mode-string as IW[<queue name>: <title>]; visit also echoes position N/M. Not persisted across restarts."
alternatives = ["header-line in the visited buffer only", "echo area only", "persist to a file"]
rationale = "Mode line stays visible across buffer navigation, which is exactly when the retained target differs from point. Persistence would add a state file ADR-001 discourages."
