summary = "git checkout blocked in worker; mutant reverts by reverse edit"
detail = '''A git-guard hook refuses 'git checkout -- <file>', so workers applying temporary mutants for red evidence must revert by reverse edit and confirm with git diff. Also: elisp closure greps using \b mis-match symbols because '-' is a word boundary; and batch indent-region misindents org-with-point-at unless org is required first (RV-002 remediation, SL-001).'''

