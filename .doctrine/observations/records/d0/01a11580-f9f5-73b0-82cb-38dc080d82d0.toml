detail = "test-all passes the just variable emacs30 (default 'emacs-30'), but on the CLI 'just test-each emacs30' passes the literal 'emacs30', which is not on PATH, so it fails with exit 127. You have to know to pass 'emacs-30'. A test-each-all recipe or a bin default that resolves the variable would remove the trap."

