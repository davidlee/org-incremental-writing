description = "If a redistribution write fails, the operation stops and reports which files were saved, which buffers are modified and which were untouched, and does not complete the pending navigation."
tags = []
acceptance_criteria = [
  "A simulated write failure mid-plan produces a report partitioning affected files into saved/modified/untouched.",
  "Continue does not navigate onward after a failed redistribution.",
]
