description = "Queue state is derived from live buffer contents where a file is visited, including unsaved changes; disk contents are used only for files with no live buffer."
tags = []
acceptance_criteria = [
  "An unsaved IW_<Q> edit in a visiting buffer is reflected in the queue ordering.",
  "A disk scan never overwrites or conceals a live buffer's state.",
]
